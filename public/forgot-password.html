<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password · Talents Unlocked</title>
    <meta name="description" content="Reset your Talents Unlocked account password.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="/style.css?v=7">
</head>
<body class="auth-page" data-page="forgot" data-auth="guest">
    <header class="site-nav">
        <div class="nav-inner">
            <a class="brand" href="/">Talents Unlocked<span class="brand-dot">.</span></a>
            <nav class="nav-links" aria-label="Main">
                <a href="/#courses">Courses</a>
                <a href="/#why">How it works</a>
            </nav>
            <div class="nav-actions">
                <a class="btn btn-ghost btn-sm" href="/login.html" data-auth-show="guest">Log in</a>
                <a class="btn btn-primary btn-sm" href="/signup.html" data-auth-show="guest">Sign up</a>
            </div>
        </div>
    </header>

    <main class="auth-main" id="main">
        <section class="layout">
            <div class="form-panel">
                <div class="form-content">
                    <p class="eyebrow">LET'S FIND YOUR ACCOUNT</p>
                    <h1>Forgot your password?</h1>
                    <p class="subtitle">Enter the email you used to sign up.</p>
                    <div id="notice-box" aria-live="polite"></div>
                    <form id="forgot-form">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" maxlength="254" required>
                        <p class="field-help">Demo mode: reset emails are not sent.</p>
                        <button id="forgot-submit" type="submit">Send Reset Link <span aria-hidden="true">↗</span></button>
                    </form>
                    <p class="switch-page"><a href="/login.html">← Back to Login</a></p>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <a class="brand" href="/">Talents Unlocked<span class="brand-dot">.</span></a>
            <span>Learn anything, at your own pace.</span>
        </div>
    </footer>

    <script src="/app.js?v=5"></script>
</body>
</html>
